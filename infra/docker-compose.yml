# 로컬 테스트용. infra/ 안에서 `docker compose up`으로 실행.
#
# postgres + redis + python-agent + backend(NestJS) 네 개.
#
# 실행: cd infra && docker compose up
# 재실행 시 DB를 깨끗하게 다시 만들고 싶으면: docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432" # 호스트에서 psql로 직접 확인하고 싶을 때 필요 (5432는 다른 프로젝트 컨테이너가 점유 중이라 5433으로 매핑)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telefit -d telefit"]
      interval: 5s
      timeout: 5s
      retries: 10

  python-agent:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../agent:/app/agent
    env_file:
      - ../agent/.env
    environment:
      # 컨테이너 안에서는 "localhost"가 아니라 서비스명(postgres)으로 접근해야 함 —
      # .env의 DATABASE_URL(localhost 기준)은 로컬 직접 실행용이고, 이 값이 그걸 덮어씀.
      DATABASE_URL: postgresql://telefit:telefit@postgres:5432/telefit
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "pip install --no-cache-dir -r agent/requirements.txt &&
               uvicorn agent.worker:app --host 0.0.0.0 --port 8000 --reload
               --reload-exclude 'agent/venv/*'"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # 호스트에서 redis-cli로 직접 확인하고 싶을 때 필요 (6379는 다른 프로젝트 컨테이너가 점유 중이라 6380으로 매핑)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../backend:/app
      - /app/node_modules # 호스트(Windows) node_modules를 안 덮어쓰게 분리 — 컨테이너 안에서만 설치/사용
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-agent:
        condition: service_started
    command: >
      sh -c "npm install &&
             npm run start:dev"

volumes:
  pgdata: