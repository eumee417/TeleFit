# 로컬 테스트용. infra/ 안에서 `docker compose up`으로 실행.
#
# postgres + redis + backend(NestJS) 세 개.
# python-agent는 별도 배포 대상이라 agent/docker-compose.yml로 분리됨 —
# 같이 테스트하려면 그쪽을 따로 띄우고, backend/.env의 AGENT_BASE_URL이
# 그 주소(로컬이면 http://host.docker.internal:8000)를 가리키게 해야 함.
#
# 실행: cd infra && docker compose up
# 재실행 시 DB를 깨끗하게 다시 만들고 싶으면: docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432" # 호스트에서 psql로 직접 확인하고 싶을 때 필요 (5432는 다른 프로젝트 컨테이너가 점유 중이라 5433으로 매핑)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telefit -d telefit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # 호스트에서 redis-cli로 직접 확인하고 싶을 때 필요 (6379는 다른 프로젝트 컨테이너가 점유 중이라 6380으로 매핑)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../backend:/app
      - /app/node_modules # 호스트(Windows) node_modules를 안 덮어쓰게 분리 — 컨테이너 안에서만 설치/사용
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm install &&
             npm run start:dev"

volumes:
  pgdata: